<style>

.nb{background:#fff;color:var(--ink);border-radius:10px;font-size:11px;padding:1px 7px}.nb.red{background:#ff5c6c;color:#fff}.nb.amber{background:#f5b041;color:#1b1b1b}

.x{border:0;background:none;font-size:20px;color:var(--mut);cursor:pointer;line-height:1}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}.split .card{overflow-x:auto}.stick{position:sticky;top:16px}
.steps{display:flex;gap:4px;margin:-4px 0 16px;flex-wrap:wrap}.steps span{font-size:12px;padding:5px 10px;border-radius:20px;background:#ebecef;color:var(--mut)}.steps span.done{background:var(--gb);color:var(--g)}.steps span.now{background:var(--red);color:#fff}

.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.sugg button{border:1px solid var(--line);background:#fafafb;border-radius:20px;padding:7px 12px;font:500 12.5px Inter;cursor:pointer}.sugg button:hover{border-color:var(--red)}.empty .composer{border:0;padding:0}
.ib-h{display:flex;justify-content:space-between;margin-bottom:6px}.pad{padding:12px}

.role.three{grid-template-columns:1fr 1fr 1fr}.role.three button{font-size:11.5px}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.stage.done{background:var(--gb);border-color:#bfe3cf}.stage.done i{background:var(--g)}.stage.now{border-color:var(--red);box-shadow:0 0 0 2px #f8d5da}.stage small{display:block;font-size:11px;color:var(--mut);margin-top:4px}

.acks{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:8px}label.inline{flex-direction:row;align-items:center;gap:10px}label.inline input{width:120px}
.tag{display:inline-block;background:#f0f1f4;border-radius:5px;padding:1px 7px;font-size:11.5px;margin:2px 2px 0 0;color:var(--ink2)}

.lim{width:100%;border-collapse:collapse;font-size:12.5px}.lim td{padding:4px 0;border-bottom:1px solid #f3f3f5}.lim small{display:block;color:var(--mut);font-size:10.5px}.lim tr.over td{color:var(--r);font-weight:600}
