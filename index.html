<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FundPath</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column, max 1080px. "Where everything stands" path runs left to right under the header; each stage shows one main task and one primary button. */
:root{
  --bg:#f6f5f3; --card:#ffffff; --soft:#f1efec; --ink:#1b1718; --muted:#635b5c; --line:#e3dedb;
  --red:#c3142d; --red-ink:#ffffff; --red-soft:#fbe8ea;
  --ok:#17784a; --ok-soft:#e2f3e9; --warn:#995500; --warn-soft:#fcf0dc; --bad:#b42318; --bad-soft:#fde8e6; --info:#245f96; --info-soft:#e5eff9;
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --shadow:0 1px 2px rgba(40,20,20,.05),0 6px 20px rgba(40,20,20,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131011; --card:#1d191a; --soft:#262122; --ink:#f4efee; --muted:#b0a6a7; --line:#383031;
  --red:#ef4b62; --red-ink:#ffffff; --red-soft:#3b1a20;
  --ok:#5fcb93; --ok-soft:#173225; --warn:#e8a94f; --warn-soft:#3a2b14; --bad:#f4796e; --bad-soft:#3e1b18; --info:#8bbbe8; --info-soft:#172739;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131011; --card:#1d191a; --soft:#262122; --ink:#f4efee; --muted:#b0a6a7; --line:#383031;
  --red:#ef4b62; --red-ink:#ffffff; --red-soft:#3b1a20;
  --ok:#5fcb93; --ok-soft:#173225; --warn:#e8a94f; --warn-soft:#3a2b14; --bad:#f4796e; --bad-soft:#3e1b18; --info:#8bbbe8; --info-soft:#172739;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
h1{font-size:2rem} h2{font-size:1.6rem} h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--red)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 55%,transparent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.88rem} .num{font-variant-numeric:tabular-nums} .mono{font-family:var(--mono);font-size:.85em}
.stack{display:flex;flex-direction:column;gap:16px} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .between{justify-content:space-between}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;margin-right:auto;letter-spacing:-.02em}
.logo svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.92rem;cursor:pointer}
.role{width:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.92rem}
.ask{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}

/* path */
.pathwrap{background:var(--card);border-bottom:1px solid var(--line)}
.path{max-width:1180px;margin:0 auto;display:flex;gap:0;padding-block:16px 18px;overflow-x:auto}
.node{flex:1 1 0;min-width:150px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;background:none;border:0;text-align:left;cursor:pointer;padding:0 12px 0 0}
.node::after{content:"";position:absolute;top:17px;left:42px;right:8px;height:3px;border-radius:2px;background:var(--line)}
.node:last-child::after{display:none}
.node.done::after{background:var(--ok)}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--muted);position:relative;z-index:1}
.node.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.node.wait .dot{border-color:var(--warn);color:var(--warn)}
.node.cur .dot{background:var(--red);border-color:var(--red);color:var(--red-ink);box-shadow:0 0 0 5px var(--red-soft)}
.node .lbl{font-weight:700;font-size:.98rem;line-height:1.2}
.node .st{font-size:.82rem;color:var(--muted);line-height:1.25}
.node.cur .lbl{color:var(--red)}

.wrap{max-width:1080px;margin:0 auto;padding-block:28px 140px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;min-width:0}
.card.tight{padding:18px}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.sub{font-size:1.05rem;color:var(--muted);max-width:62ch}

/* buttons */
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;font-size:1rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.go:hover{filter:brightness(1.06)}
.btn.big{padding:16px 26px;font-size:1.1rem;border-radius:14px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;color:var(--red);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1;padding:6px 8px;border-radius:8px}
.x:hover{background:var(--soft);color:var(--bad)}

/* fields */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none}
textarea{resize:vertical;min-height:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--ok)}

/* agent card */
.agent{border:2px dashed color-mix(in srgb,var(--red) 35%,var(--line));background:linear-gradient(180deg,var(--red-soft),var(--card) 70%);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:20px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.tile.primary{border-color:var(--red)}
.tile .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--red-soft);color:var(--red)}
.tile b{font-size:1.1rem}
.tile span{color:var(--muted);font-size:.92rem}

/* mini steps inside recording */
.mini{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.mini span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.mini span.on{color:var(--red)} .mini span.ok{color:var(--ok)}
.mini i{font-style:normal;color:var(--line)}
.rec{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.recbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 0 rgba(195,20,45,.45);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(195,20,45,.45)}70%{box-shadow:0 0 0 18px rgba(195,20,45,0)}100%{box-shadow:0 0 0 0 rgba(195,20,45,0)}}
.timer{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.recbtn,.spin{animation:none}}
.script{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto;padding:4px}
.utt{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:10px;border-radius:12px;transition:opacity .3s}
.utt.on{background:var(--red-soft)}
.utt.later{opacity:.35}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.who{font-size:.82rem;color:var(--muted);font-weight:700}

/* budget */
.total{display:flex;flex-direction:column;gap:8px}
.bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.bar i.over{background:var(--bad)} .bar i.near{background:var(--warn)}
.big{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.ev{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.ev-h{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:14px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.ev-h input[type=text]{background:var(--card)}
.ev-h .name{flex:2 1 220px;font-weight:700}
.ev-h .date{flex:1 1 150px}
.ev-h .tiny{width:84px;flex:none}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:800;letter-spacing:.02em}
.tag.event{background:var(--info-soft);color:var(--info)} .tag.trip{background:var(--warn-soft);color:var(--warn)} .tag.ne{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.ln{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) 120px minmax(0,1.2fr) auto auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.ln:last-of-type{border-bottom:0}
@media (max-width:820px){.ln{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ln .amt{grid-column:auto}}
.ln .why{grid-column:1/-1;font-size:.88rem;margin-top:-4px}
.addln{padding:10px 16px}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;font-weight:600}
.flag.error{color:var(--bad)} .flag.review{color:var(--warn)} .flag.info{color:var(--info)}
.flag .src{font-weight:500;color:var(--muted)}
details.more{border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;background:var(--card)}
details.more summary{cursor:pointer;font-weight:700}
details.more[open] summary{margin-bottom:14px}

/* sticky action bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(0,0,0,.05)}
.dock-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;justify-content:space-between;padding-block:14px}
.dock .msg{font-weight:700;display:flex;align-items:center;gap:10px}

/* status blocks */
.hero{display:flex;gap:18px;align-items:flex-start;padding:22px;border-radius:16px}
.hero .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;font-weight:800;font-size:1.4rem}
.hero.ok{background:var(--ok-soft)} .hero.ok .ic{background:var(--ok)}
.hero.wait{background:var(--warn-soft)} .hero.wait .ic{background:var(--warn)}
.hero.bad{background:var(--bad-soft)} .hero.bad .ic{background:var(--bad)}
.hero.info{background:var(--info-soft)} .hero.info .ic{background:var(--info)}
.hero h2{font-size:1.4rem}
.flow{display:flex;gap:0;overflow-x:auto;padding:4px 0}
.fs{flex:1 1 0;min-width:130px;display:flex;flex-direction:column;gap:6px;position:relative;padding-right:10px}
.fs::after{content:"";position:absolute;top:13px;left:32px;right:4px;height:3px;background:var(--line);border-radius:2px}
.fs:last-child::after{display:none}
.fs.done::after{background:var(--ok)}
.fs .d{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:.8rem;color:var(--muted);z-index:1}
.fs.done .d{background:var(--ok);border-color:var(--ok);color:#fff}
.fs.cur .d{border-color:var(--red);color:var(--red)}
.fs b{font-size:.92rem} .fs span{font-size:.8rem;color:var(--muted)}

table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
th{text-align:left;font-size:.8rem;font-weight:700;color:var(--muted);padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.95rem}
tr:last-child td{border-bottom:0}
.r{text-align:right}
td input,td select{padding:7px 9px;font-size:.92rem}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--soft);color:var(--muted)} .p-red{background:var(--red-soft);color:var(--red)}

/* receipts */
.drop{border:2px dashed var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--red);background:var(--red-soft)}
.rc{border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.rc.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.rc-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.fname{font-family:var(--mono);font-size:.88rem;background:var(--soft);padding:6px 10px;border-radius:8px;word-break:break-word}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat small{font-weight:500;opacity:.75}
.rc-f{display:grid;grid-template-columns:150px minmax(0,1.6fr) 130px 110px;gap:10px}
@media (max-width:760px){.rc-f{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.sumtbl td:first-child{font-weight:700}

/* queues */
.q2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.q2{grid-template-columns:minmax(0,1fr)}}
.qlist{display:flex;flex-direction:column;gap:10px}
.qi{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;cursor:pointer}
.qi[aria-current="true"]{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;padding:10px 16px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--red)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.checks{display:flex;flex-direction:column;gap:8px}
.ck{display:grid;grid-template-columns:24px 1fr;gap:8px}
.ck .m{font-weight:800} .ck.ok .m{color:var(--ok)} .ck.no .m{color:var(--bad)} .ck.na .m{color:var(--warn)}

/* chat */
.chat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));height:min(620px,calc(100% - 120px));background:var(--card);border:1px solid var(--line);border-radius:18px;z-index:20;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.chat-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;font-size:.96rem}
.m.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.86rem;cursor:pointer;font-weight:600}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:14px;background:var(--ok-soft);font-weight:600;margin-bottom:18px}
.welcome{max-width:640px;margin:40px auto 0}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tier{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left}
.tier[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.tier b{font-size:1.05rem} .tier span{color:var(--muted);font-size:.88rem}
.mode{font-size:.8rem;font-weight:700;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted)} .mode i.on{background:var(--ok)}
</style>

<header class="top"><div class="top-in gut">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="5" cy="22" r="4" fill="var(--red)"/><circle cx="15" cy="12" r="4" fill="var(--red)" opacity=".7"/><circle cx="25" cy="6" r="4" fill="var(--red)" opacity=".45"/><path d="M5 22 L15 12 L25 6" stroke="var(--red)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>FundPath</div>

const Store={mode:"local",apps:{},db:null};

function save(app,immediate){

async function connectArtifact(){

const evOf=(a,id)=>a.events.find(e=>e.id===id);
function mkLine(group,eventId,item,category,amount,vendor,note){return {id:uid(),group,eventId,item,category,amount:Math.round(Number(amount)*100)/100,vendor:vendor||"",note:note||"",quote:""}}

/* ================= BUDGET RULES ================= */
function totals(a){
  const L=a.lines,by=c=>sum(L.filter(l=>l.category===c).map(l=>l.amount));
  const t={total:sum(L.map(l=>l.amount)),food:by("Event: Food")+by("Trip: Food"),admin:by("Admin Item"),storage:by("Storage"),speakers:by("Event: Guest Speaker"),hotels:by("Trip: Hotels"),flights:by("Trip: Flights")};
  t.tierMax=TIERS[a.tier]||0;t.cap=Math.max(0,t.tierMax-(Number(a.org.prior)||0));t.foodCap=FOOD_CAP[a.tier]||0;
  const trips=a.events.filter(e=>e.type==="Trip");
  t.hotelCap=50*trips.reduce((x,e)=>x+(+e.people||0)*(+e.nights||0),0);t.flightCap=300*trips.reduce((x,e)=>x+(+e.flightPeople||0),0);
  return t;
}
function validate(a){
  const out=[],add=(sev,msg,src,x={})=>out.push({sev,msg,src,...x});const o=a.org,t=totals(a);
  const need=[["treasurer","Treasurer name"],["president","President name"],["advisor","Advisor name"]];
  need.forEach(([k,l])=>{if(!o[k])add("error",`${l} is missing.`,S.tpl1,{club:1})});
  [["email","Club email"],["presidentEmail","President email"],["treasurerEmail","Treasurer email"]].forEach(([k,l])=>{if(!o[k])add("error",`${l} is missing.`,S.tpl1,{club:1});else if(!/@miamioh\.edu$/i.test(o[k].trim()))add("error",`${l} must end in @miamioh.edu.`,S.tpl1,{club:1})});
  if(!/^SA1\d{4}$/.test((o.sa||"").trim()))add("error","SA number should look like SA1#### (your club's Workday worktag).",S.tpl1,{club:1});
  if(!a.events.length)add("error","Add at least one event or trip.",S.hub);
  for(const e of a.events){
    if(!e.name||!e.date)add("error",`Give "${e.name||"this "+e.type.toLowerCase()}" a name and date.`,S.hub,{ev:e.id});
    if(e.type==="Trip"&&!(+e.people>0))add("error",`How many people are going on "${e.name}"?`,S.hub,{ev:e.id});
    if(!e.onHub)add("error",`"${e.name||"This event"}" needs to be listed on Miami Central. Flip the switch once it is.`,S.hub,{ev:e.id});
  }
  for(const l of a.lines){
    if(!l.item||!(+l.amount>0))add("error","Each expense needs a description and an amount.",S.tpl1,{line:l.id});
    const ev=evOf(a,l.eventId);
    if(l.group==="event"&&ev&&(ev.type==="Trip")!==l.category.startsWith("Trip:"))add("error",`Pick a ${ev.type==="Trip"?"trip":"event"} category for this line.`,S.hub,{line:l.id});
    if((l.category==="Trip: Hotels"||l.category==="Trip: Flights"||+l.amount>1000)&&!l.quote)add("error","Attach a quote (required for hotels, flights and items over $1,000).",S.tpl1,{line:l.id,fix:"quote"});
    const txt=`${l.item} ${l.vendor} ${l.note}`;
    if(PROHIBITED.test(txt))add("error",`ASG can't fund ${txt.match(PROHIBITED)[0]}.`,S.pr,{line:l.id});
    if(CLOTHING.test(txt))add("review","Clothing needs a trademark check and may not be fundable.",S.sa,{line:l.id});
    if(VAGUE.test(l.item||""))add("review","This reads like a lump sum. Break it into specific expenses.","ASG committee criterion: itemized",{line:l.id});
  }
  if(t.cap&&t.total>t.cap)add("error",`You're ${money(t.total-t.cap)} over your Tier ${a.tier} limit of ${money(t.cap,1)}.`,S.tpl,{fix:"total"});
  if(t.food>t.foodCap)add("error",`Food is ${money(t.food-t.foodCap)} over the Tier ${a.tier} food cap (${money(t.foodCap,1)}).`,S.tpl,{fix:"food"});
  if(t.admin>1000)add("error","Admin items are over the $1,000 cap.",S.tpl);
  if(t.storage>1000)add("error","Storage is over the $1,000 cap.",S.tpl);
  if(t.speakers>3000)add("error","Guest speakers are over the $3,000 cap.",S.tpl);
  if(t.hotels>t.hotelCap)add("error",`Hotels are ${money(t.hotels-t.hotelCap)} over the $50 per person per night limit.`,S.tpl,{fix:"hotel",line:(a.lines.find(l=>l.category==="Trip: Hotels")||{}).id});
  if(t.flights>t.flightCap)add("error","Flights are over $300 per person.",S.tpl);
  return {all:out,errors:out.filter(i=>i.sev==="error"),reviews:out.filter(i=>i.sev==="review"),t};
}
function autoFix(a,k){
  const t=totals(a),scale=(f,pred)=>a.lines.filter(pred).forEach(l=>l.amount=Math.floor(+l.amount*f*100)/100);
  if(k==="hotel")scale(t.hotelCap/t.hotels,l=>l.category==="Trip: Hotels");
  if(k==="food")scale(t.foodCap/t.food,l=>/Food$/.test(l.category));
  if(k==="total")scale(t.cap/t.total,()=>true);
  log(a,"Treasurer","Applied a one-click fix: "+k);
}

const SCRIPT=[

];
const scriptText=()=>SCRIPT.map(([n,r,t])=>`${n} (${r}): ${t}`).join("\n");
const MONTHS=/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/;
function vendorOf(s){for(const m of s.matchAll(/from ([A-Z][\w'&]*(?: [A-Z][\w'&]*)*)/g))if(!MONTHS.test(m[1]))return m[1];return ""}
function parseTranscript(text){
  const res={tier:null,prior:null,events:[],lines:[]};let allHub=false,ev=null;
  const rows=text.split(/\n+/).map(s=>s.replace(/^[A-Z][\w .'-]*\([^)]*\):\s*|^(?:Speaker \d+|[A-Z][\w'-]*):\s+/,"").trim()).filter(Boolean);
  const dateRe=/\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|June?|July?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.? (\d{1,2})(?:\s*(?:to|through|-|–)\s*(?:(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|June?|July?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.? )?(\d{1,2}))?/;
  const amts=s=>[...s.matchAll(/\$\s?([\d,]+(?:\.\d{1,2})?)/g)].map(m=>parseFloat(m[1].replace(/,/g,"")));
  for(const row of rows){
    const tm=row.match(/tier\s*(\d)/i);
    if(tm&&!/^(event|trip|non-event)/i.test(row)){res.tier=+tm[1];if(/(haven't|hasn't|nothing|zero|no funding)/i.test(row))res.prior=0;continue}
    if(/listed on (miami central|the hub)/i.test(row)){allHub=true;continue}
    let m=row.match(/^(event|trip)\b[^:]*:\s*(.*)$/i);
    if(m){
      const type=/trip/i.test(m[1])?"Trip":"Event",rest=m[2].replace(/^the\s+/i,"");
      const name=rest.split(/,| every | from | on | in (?=[A-Z])|\. /)[0].trim().replace(/\.$/,"");
      const d=rest.match(dateRe);
      ev={id:uid(),type,name,date:d?`${d[1]} ${d[2]}`+(d[4]?` – ${d[3]?d[3]+" ":""}${d[4]}`:""):"",people:0,nights:0,flightPeople:0,onHub:false};
      if(type==="Trip"){const p=rest.match(/(\w+) (?:people|members|students)/i),n=rest.match(/(\w+) nights?/i);ev.people=toNum(p&&p[1]);ev.nights=toNum(n&&n[1])}
      res.events.push(ev);
      const h=rest.match(/\$([\d.]+) per person per night/i);
      if(h){res.lines.push(mkLine("event",ev.id,"Hotel","Trip: Hotels",+h[1]*ev.people*ev.nights,"",`${money(h[1])} × ${ev.people} people × ${ev.nights} nights`));continue}
      const a=amts(rest);if(a.length)res.lines.push(...[].concat(fromSentence(rest,a,ev)));continue;
    }
    m=row.match(/^non-event\b[^:]*:\s*(.*)$/i);
    if(m){const rest=m[1],a=amts(rest);if(!a.length)continue;
      let item=rest.split(/,/)[0].replace(/^(a|an|the)\s+/i,"").replace(/ from .*/,"").trim();item=item[0].toUpperCase()+item.slice(1);
      let cat="Admin Item";if(/capital|keep (it )?for years|tent|table cover|equipment/i.test(rest))cat="Capital Item";else if(/banner/i.test(rest))cat="Banners";else if(/storage/i.test(rest))cat="Storage";else if(/flyer|marketing|poster/i.test(rest))cat="Marketing";
      res.lines.push(mkLine("nonevent",null,item,cat,a[a.length-1],vendorOf(rest),""));continue}
    const a=amts(row);if(a.length&&ev)res.lines.push(...[].concat(fromSentence(row,a,ev)));
  }
  if(allHub)res.events.forEach(e=>e.onHub=true);
  return res;
}
function fromSentence(s,a,ev){
  const trip=ev.type==="Trip";let cat,item;
  if(/gas|fuel|gallon/i.test(s)){cat="Trip: Gas";item="Gas"}
  else if(/flight|airfare|plane/i.test(s)){cat="Trip: Flights";item="Flights"}
  else if(/hotel|lodging/i.test(s)){cat="Trip: Hotels";item="Hotel"}
  else if(/cater|food|pizza|meal|dinner|lunch|breakfast|snack/i.test(s)){cat=trip?"Trip: Food":"Event: Food";item=trip?"Meals":"Catering"}
  else if(/speaker|honorari/i.test(s)){cat="Event: Guest Speaker";item="Speaker honorarium"}
  else if(/\bdj\b|band|entertain/i.test(s)){cat="Event: Entertainer";item="Entertainer"}
  else if(/lane|room|venue|space|rental|facility/i.test(s)){cat=trip?"Trip: Other Travel":"Event: Space Fee";item=/lane/i.test(s)?"Lane rental":"Venue rental"}
  else if(/flyer|poster|marketing/i.test(s)){cat="Event: Marketing";item="Marketing"}
  else{cat=trip?"Trip: Other Travel":"Event: Other";item="Expense"}
  const cnt=s.match(/(\w+) speakers? at (?:a )?\$([\d,]+)/i);
  if(cnt&&toNum(cnt[1])>1){const n=toNum(cnt[1]),each=parseFloat(cnt[2].replace(/,/g,""));return Array.from({length:n},(_,k)=>mkLine("event",ev.id,`Speaker ${k+1} honorarium`,cat,each,"",`${n} speakers × ${money(each,1)}`))}
  const gas=s.match(/(\w+) vehicles?, (\d+) miles/i);
  return mkLine("event",ev.id,item,cat,a[a.length-1],vendorOf(s),gas?`${toNum(gas[1])} vehicles · ${gas[2]} miles each way`:"");
}

const FNAME=/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})\s+(.+?)\s*[-–]\s*\$\s*([\d,]+(?:\.\d{1,2})?)\s*(?:\(\s*\$?([\d.]+)\s*tip\s*\))?/i;
const VEND_STOP=/\s+(guest|speaker|catering|invoice|receipt|restaurant|lunch|dinner|coffee|one-time|business|annual|subscription|hotel|flight|gas|trip|order|bill|office|supplies)\b/i;
function guessCat(t){t=t.toLowerCase();
  if(/speaker/.test(t))return "speaker";
  if(/\b(hotel|flights?|airfare|airline|gas|fuel|uber|lyft|bus|charter|rental car|hertz|enterprise|conference|trip|parking)\b/.test(t))return "trip";
  if(/cater|restaurant|lunch|dinner|coffee|pizza|food|snack|domino|jersey mike|chipotle/.test(t))return "food";
  if(/subscription|canva|office|supplies|pens?|pencils?|paper|printing|staples/.test(t))return "admin";
  if(/banner|tent|table cover|equipment/.test(t))return "capital";
  if(/driver|venue|lanes|dj|space|room|flyer|poster/.test(t))return "event";
  return "";
}
function parseReceiptName(name){
  const base=name.replace(/\.(pdf|png|jpe?g|heic|webp|gif)$/i,"").trim();const m=base.match(FNAME);if(!m)return null;
  let y=+m[3];if(y<100)y+=2000;const date=`${y}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
  const rest=m[4].trim();const vendor=(rest.split(VEND_STOP)[0]||rest).trim();
  return {date,vendor,desc:rest,amount:parseFloat(m[5].replace(/,/g,"")),tip:m[6]?+m[6]:0,category:guessCat(rest)};
}
function stdName(r){
  if(!r.date||!r.vendor||!(+r.amount>0))return "";
  const [y,mo,d]=r.date.split("-");const c=RC[r.category];
  const label=c?(r.category==="trip"&&r.tripType?`Trip ${TRIP_TYPES[r.tripType].split(" ")[0]}`:c.file):"";
  return `${+mo}.${+d}.${String(y).slice(2)} ${r.vendor.trim()} ${label?label+" ":""}Invoice - $${(+r.amount).toFixed(2)}`;
}

/* ---- stage 2: ASG ---- */
function stASG(a){
  const s=a.status;
  if(s==="draft")return lockedStage("ASG approval","Submit your budget first. Clean budgets are approved instantly.","Go to my budget",1);
  if(s==="review")return `<div class="stack"><h1>ASG approval</h1>${hero("wait","…","With the Secretary of Treasury","A few items need a person's eyes. You'll get the decision and every reason right here.")}${whatsNext(["Submitted","ASG review","Decision","Workday"],1)}</div>`;
  const x=a.asg,appr=sum(Object.values(x.approved)),req=totals(a).total;
  const changed=a.lines.filter(l=>+x.approved[l.id]<+l.amount);
  const word={auto:"Approved instantly",approved:"Approved",partial:"Approved with changes",denied:"Not approved"}[x.decision];
  return `<div class="stack" style="gap:20px"><h1>ASG approval</h1>
    ${hero(x.decision==="denied"?"bad":x.decision==="partial"?"wait":"ok",x.decision==="denied"?"×":"✓",`${word}: ${money(appr)}`,`${x.decision==="partial"?`You asked for ${money(req)}. `:""}${esc(x.note)}`)}
    ${changed.length?`<div class="card"><h3>What changed and why</h3><div class="tw"><table><thead><tr><th>Expense</th><th class="r">Asked</th><th class="r">Approved</th><th>Reason</th></tr></thead><tbody>${changed.map(l=>`<tr><td>${esc(l.item)}</td><td class="r num">${money(l.amount)}</td><td class="r num"><b>${money(x.approved[l.id])}</b></td><td class="small">${esc(x.reasons[l.id]||"")}</td></tr>`).join("")}</tbody></table></div></div>`:""}
    <div class="row">${x.decision==="denied"?`<button class="btn go big" data-act="revise">Fix and resubmit</button>`:`<button class="btn go big" data-act="stage" data-n="3">Next: send it to Workday →</button>`}</div></div>`;
}

/* ---- stage 3: workday ---- */

      <div class="tw"><table><thead><tr><th>Spend category</th><th class="r">Amount</th><th>What it covers</th></tr></thead><tbody>
      ${sa.lines.map((l,i)=>`<tr><td style="min-width:220px"><select data-bind="sa.lines.${i}.sc" aria-label="Spend category">${Object.entries(SPEND).map(([k,v])=>`<option value="${k}" ${k===l.sc?"selected":""}>${k==="FUEL"?"":k+" · "}${v}</option>`).join("")}</select>${l.sure?"":`<div class="small" style="color:var(--warn)">Best guess — confirm with SEA</div>`}</td><td class="r num">${money(l.amount)}</td><td class="small">${esc(l.memo)}</td></tr>`).join("")}

        <label class="f">Justification<textarea data-bind="sa.justification" rows="4">${esc(sa.justification)}</textarea></label>

/* ================= CHAT ================= */
function chatContext(){const a=cur();if(!a)return {};const t=totals(a);return {club:a.club,tier:a.tier,stage:STAGES[UI.stage-1][1],status:a.status,requested:t.total,limit:t.cap,approved:a.asg?sum(Object.values(a.asg.approved)):null,cardLoaded:a.card.loaded,receipts:a.receipts.length,openIssues:validate(a).errors.map(x=>x.msg).slice(0,6)}}
function paintChat(){
  const c=$("#chat");c.hidden=!UI.chat.open;if(!UI.chat.open)return;
  const m=UI.chat.msgs;
  c.innerHTML=`<div class="chat-h"><b>Ask FundPath</b><div class="row" style="gap:6px">${BE.agentId?`<button class="btn sm" data-act="talk">Talk instead</button>`:""}<button class="x" data-act="chat-close" aria-label="Close">×</button></div></div>
  <div class="msgs" id="msgs">${m.length?"":`<div class="m a">Hi! I can help with anything about club money — ASG rules, Workday, receipts, or what to do next. What's up?</div><div class="sugg">${["What do I do next?","Can ASG pay for T-shirts?","How do I get Workday access?","Who do I email about my card?"].map(q=>`<button data-q2="${esc(q)}">${q}</button>`).join("")}</div>`}
    ${m.map(x=>`<div class="m ${x.role==="user"?"u":"a"}">${esc(x.content)}</div>`).join("")}${UI.chat.busy?`<div class="m a"><span class="spin" style="display:inline-block;width:16px;height:16px;vertical-align:middle"></span></div>`:""}</div>
  <div id="convai"></div>
  <form id="chat-form"><input type="text" id="chat-in" placeholder="Ask anything…" autocomplete="off"><button class="btn go" type="submit">Send</button></form>`;
  const box=$("#msgs");box.scrollTop=box.scrollHeight;
}
async function ask(q){
  if(!q.trim()||UI.chat.busy)return;UI.chat.msgs.push({role:"user",content:q});UI.chat.busy=true;paintChat();
  let reply=null;const msgs=UI.chat.msgs.slice(-16);
  const sys=`You are FundPath's assistant for Miami University student org treasurers, many brand new. Be warm, plain and brief (2-6 sentences). Answer anything about club finances and ASG funding. Use these sourced rules when a rule matters and say where it's from; if they don't settle it, say so and name who to contact. Never invent limits or deadlines.\nRULES:\n${POLICY.map(p=>`- ${p[0]}: ${p[1]} [${p[2]}]`).join("\n")}\nTREASURER'S SITUATION: ${JSON.stringify(chatContext())}`;
  if(BE.ai){try{const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:msgs,context:chatContext()})});const d=await r.json();if(r.ok)reply=d.reply}catch{}}
  if(!reply&&BE.claude){try{const r=await BE.claude([{role:"user",content:sys+"\n\nConversation so far follows. Reply to the last message."},{role:"assistant",content:"Understood."},...msgs],{modelTier:"default",cache:false});reply=r.text}catch{}}
  if(!reply){const ql=q.toLowerCase();const hit=POLICY.filter(p=>ql.split(/\W+/).some(w=>w.length>3&&(p[0]+" "+p[1]).toLowerCase().includes(w)));
    reply=/next/.test(ql)?nextStepText():hit.length?hit.slice(0,2).map(p=>`${p[1]} (${p[2]})`).join("\n\n"):"I'm not sure from the rules I have. ASG funding questions go to asgfunding@miamioh.edu; Workday and balance questions to studentorgfin@miamioh.edu."}
  UI.chat.msgs.push({role:"assistant",content:reply});UI.chat.busy=false;paintChat();
}
function nextStepText(){const a=cur();if(!a)return "Pick your club and tier to start a budget.";const v=validate(a);
  return {draft:v.errors.length?`Finish your budget: ${v.errors.length} item(s) need fixing, starting with "${v.errors[0].msg}"`:"Your budget is ready. Press Submit to ASG at the bottom.",review:"Wait for the Secretary of Treasury's decision; it'll show in step 2.",approved:"Send your approved budget to Workday in step 3.",partial:"Send the approved amount to Workday in step 3.",denied:"Fix the items ASG flagged and resubmit.",sa_submitted:"Accounts Payable is reviewing your Workday request.",sa_returned:"Send a fresh Workday request in step 3.",card_ready:"Pick up your card at 107 Roudebush Hall.",card_picked:"Add receipts as you spend, then submit them for audit in step 5."}[a.status]}

function setPath(o,p,v){const k=p.split(".");for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
document.addEventListener("click",async e=>{

function asgDecide(a,deny){
  const d=UI.draft,approved={};let partial=false;
  a.lines.forEach(l=>{const v=deny?0:Math.max(0,Math.min(+l.amount,+d.approved[l.id]||0));approved[l.id]=v;if(v<+l.amount)partial=true});
  const decision=deny?"denied":partial?"partial":"approved";
  const reasons={};a.lines.forEach(l=>{const inp=$(`[data-areason="${l.id}"]`);const r=(d.reasons[l.id]??inp?.value??"").trim();if(r&&approved[l.id]<+l.amount)reasons[l.id]=r});
  a.asg={decision,who:"Secretary of Treasury",note:d.note||(deny?"Denied.":partial?"Approved with the changes below.":"Approved as requested."),approved,reasons,at:now()};
  a.status=decision;a.sa=null;log(a,"ASG",`${decision==="denied"?"Denied":decision==="partial"?"Approved with changes":"Approved"}: ${money(sum(Object.values(approved)))}`);
  notify(a,"org",deny?"ASG didn't approve your budget. The reasons are in step 2.":`ASG approved ${money(sum(Object.values(approved)))}. Next: send it to Workday.`);
  UI.draft=null;save(a,true);render();toast("Sent to the club");
}
function auditDecide(a,pass){
  const d=UI.audDraft||{};
  if(!pass&&!a.receipts.some(r=>d[r.id]&&d[r.id].ok===false)){toast("Mark at least one receipt 'Needs a fix'");return}
  a.receipts.forEach(r=>{r.asg=d[r.id]||(pass?{ok:true}:r.asg)});
  a.audit={status:pass?"passed":"returned",at:now(),note:pass?"ASG accepted every receipt.":`${a.receipts.filter(r=>r.asg&&r.asg.ok===false).length} receipt(s) need a fix.`};
  log(a,"ASG",pass?"Audit passed":"Audit sent back with notes");notify(a,"org",pass?"Your audit passed. Close your Spend Authorization in Workday.":"ASG sent your audit back. The notes are on each receipt.");
  UI.audDraft=null;save(a,true);render();toast(pass?"Audit passed":"Sent back to the treasurer");
}
document.addEventListener("input",e=>{
  const el=e.target;

  if(el.dataset.areason){UI.draft.reasons[el.dataset.areason]=el.value;return}
  if(el.dataset.anote){UI.draft.note=el.value;return}
  if(el.dataset.audnote){UI.audDraft[el.dataset.audnote].note=el.value;return}
  if(el.id==="w-club"){UI.welcomeClub=el.value;return}
  const p=el.dataset.bind;if(!p||el.type==="checkbox"||el.tagName==="SELECT")return;const a=cur();if(!a)return;
  setPath(a,p,el.type==="number"?(el.value===""?"":+el.value):el.value);save(a);paintDock();
});
document.addEventListener("change",e=>{
  const el=e.target;const a=cur();
  if(el.id==="file-audio"&&el.files[0]){UI.fill="upload";transcribe(el.files[0]);el.value="";return}
  if(el.id==="file-receipts"&&el.files.length){addReceiptFiles([...el.files]);el.value="";return}
  if(el.id==="file-clubs"&&el.files[0]){const fr=new FileReader();fr.onload=()=>{const rows=String(fr.result).split(/\r?\n/).map(r=>r.split(",")[0].replace(/^"|"$/g,"").trim()).filter(x=>x&&!/^(name|organization)/i.test(x));lsSet("fp.clubs",[...new Set([...lsGet("fp.clubs",[]),...rows])]);toast(`Loaded ${rows.length} clubs`);render()};fr.readAsText(el.files[0]);el.value="";return}
  if(el.dataset.quote&&el.files[0]){const l=a.lines.find(x=>x.id===el.dataset.quote);l.quote=el.files[0].name;log(a,"Treasurer","Attached quote "+l.quote);save(a);render();return}
  if(el.dataset.rfile&&el.files[0]){const r=a.receipts.find(x=>x.id===el.dataset.rfile);FILES.put(r.id,el.files[0]).then(ok=>{r.hasFile=ok;r.fileName=el.files[0].name;save(a);render()});return}
  const p=el.dataset.bind;if(!p||!a)return;
  if(el.type==="checkbox")setPath(a,p,el.checked);else if(el.tagName==="SELECT")setPath(a,p,el.value);else{save(a);render();return}
  if(p.startsWith("sa.lines"))a.sa.lines.forEach(l=>l.sure=Object.values(CAT_MAP).some(m=>m[0]===l.sc&&m[1]));
  save(a);render();
});
