/* =====================================================================
   Miami University / Miami Central look: flat, red + white, serif display
   headings, sans body, square corners, thin rules. No gradients or glows.
   ===================================================================== */
:root{--red:#C3142D;--red-d:#9a0f23;--ink:#1d1d1d;--ink2:#3f3f3f;--mut:#6b6b6b;--line:#d9d9d9;--bg:#f4f4f4;--rad:3px;--serif:"Times New Roman",Times,serif;--sans:"Times New Roman",Times,serif}
body{font:15px/1.5 var(--sans);background:var(--bg);color:var(--ink)}
#app{display:block;min-height:100vh}
/* top bar (Miami Central style: school-red header) */
.topbar{position:sticky;top:0;z-index:15;height:58px;background:var(--red);color:#fff;display:flex;align-items:center;gap:22px;padding:0 22px;border-bottom:4px solid var(--red-d)}
.tb-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.tb-brand b{font:700 21px var(--serif);letter-spacing:.005em;display:block;line-height:1}.tb-brand small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.tb-logo{width:34px;height:34px;background:#fff;color:var(--red);display:grid;place-items:center;font:700 22px var(--serif);border-radius:2px}
.tb-nav{display:flex;flex-direction:row;gap:2px;height:100%;padding:0}.tb-nav a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:0 12px;display:flex;align-items:center;border-bottom:4px solid transparent;margin-bottom:-4px}.tb-nav a:hover,.tb-nav a.on{border-bottom-color:#fff}
.tb-search{flex:1;max-width:420px}.tb-search input{background:#fff;border:0;border-radius:2px;padding:8px 12px;font-size:13.5px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
